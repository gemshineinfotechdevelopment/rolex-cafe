# ==============================================================================
# Nginx Configuration for Rolex Cafe
# Subdomain: rolex-cafe.gemshine.tech
# Reverse Proxy to PM2 (Port 5022)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name rolex-cafe.gemshine.tech;

    # Maximum file upload size
    client_max_body_size 25M;

    # Gzip Compression for Optimal Performance
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        application/xml
        image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Reverse Proxy to Node/PM2 Preview Server on Port 5022
    location / {
        proxy_pass http://127.0.0.1:5022;
        proxy_http_version 1.1;
        
        # WebSocket / Connection upgrade headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Standard proxy forwarding headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Static assets cache optimization
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://127.0.0.1:5022;
        proxy_set_header Host $host;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Error logging
    error_log /var/log/nginx/rolex_cafe_error.log warn;
    access_log /var/log/nginx/rolex_cafe_access.log combined;
}
